apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com:RedHatInsights/bonfire-tekton?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main" && files.all.exists(x, x.matches('.tekton/|pipelines/|tasks/'))
  labels:
    appstudio.openshift.io/application: bonfire-tekton
    appstudio.openshift.io/component: bonfire-tekton
  name: bonfire-tekton-on-pull-no-iqe-request
  namespace: rhtap-migration-tenant
spec:
  params:
  - name: URL
    value: '{{source_url}}'
  - name: REVISION
    value: '{{revision}}'
  - name: SNAPSHOT
    value: |
      {
        "application": "insights-ingress-go",
        "components": [
            {
                "name": "ingress",
                "containerImage": "quay.io/redhat-services-prod/hcc-integrations-tenant/insights-ingress-go:62e640335636950bc3b20abd5ac2f92b8e0c1dfe@sha256:12ec98e67d4391d42136f04308083bc23348b223f9843883fbb052c12c9242ad",
                "source": {
                    "git": {
                        "url": "https://github.com/RedHatInsights/insights-ingress-go",
                        "revision": "62e640335636950bc3b20abd5ac2f92b8e0c1dfe"
                    }
                }
            }
        ],
        "artifacts": {}
      }
  - name: APP_NAME
    value: ingress
  - name: COMPONENT_NAME
    value: ingress
  - name: DEPLOY_TIMEOUT
    value: "950"
  pipelineRef:
      resolver: git
      params:
      - name: url
        value: '{{source_url}}'
      - name: revision
        value: '{{revision}}'
      - name: pathInRepo
        value: pipelines/basic_no_iqe.yaml
